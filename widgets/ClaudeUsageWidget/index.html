<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8"/>
		<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
		<title>tr('Claude Code Usage')</title>
		<link rel="icon" type="image/svg+xml" href="resources/claude-usage.svg"/>

		<meta
			name="x-icue-property"
			content="refreshInterval"
			data-label="tr('Refresh Interval')"
			data-type="slider"
			data-default="60"
			data-min="10"
			data-max="300"
			data-step="10"
			data-unit-label="'s'"
		/>

		<meta
			name="x-icue-property"
			content="thresholdColorCoding"
			data-label="tr('Threshold Color Coding')"
			data-type="switch"
			data-default="true"
		/>

		<meta
			name="x-icue-property"
			content="textColor"
			data-label="tr('Text Color')"
			data-type="color"
			data-default="'#FFFFFF'"
		/>

		<meta
			name="x-icue-property"
			content="blockColor"
			data-label="tr('Block Color')"
			data-type="color"
			data-default="'#3B82F6'"
		/>

		<meta
			name="x-icue-property"
			content="emptyBlockColor"
			data-label="tr('Empty Block Color')"
			data-type="color"
			data-default="'#484848'"
		/>

		<meta
			name="x-icue-property"
			content="percentageColor"
			data-label="tr('Percentage Color')"
			data-type="color"
			data-default="'#FFFFFF'"
		/>

		<meta
			name="x-icue-property"
			content="colorLow"
			data-label="tr('Low Color')"
			data-type="color"
			data-default="'#10B981'"
		/>

		<meta
			name="x-icue-property"
			content="colorMid"
			data-label="tr('Medium Color')"
			data-type="color"
			data-default="'#F59E0B'"
		/>

		<meta
			name="x-icue-property"
			content="colorHigh"
			data-label="tr('High Color')"
			data-type="color"
			data-default="'#EF4444'"
		/>

		<meta
			name="x-icue-property"
			content="backgroundColor"
			data-label="tr('Background Color')"
			data-type="color"
			data-default="'#161616'"
		/>

		<meta
			name="x-icue-property"
			content="transparency"
			data-label="tr('Widget Transparency')"
			data-type="slider"
			data-default="0"
			data-min="0"
			data-max="100"
			data-step="1"
			data-unit-label="'%'"
		/>

		<script type="application/json" id="x-icue-groups">
		[
			{
				"title": "tr('Claude Code Usage')",
				"properties": ["refreshInterval", "thresholdColorCoding"]
			},
			{
				"title": "tr('Widget Personalization')",
				"properties": ["textColor", "blockColor", "emptyBlockColor", "percentageColor", "colorLow", "colorMid", "colorHigh", "backgroundColor", "transparency"]
			}
		]
		</script>

		<link rel="stylesheet" type="text/css" href="styles/ClaudeUsage.css"/>
	</head>
	<body>
		<div class="widget-background"></div>

		<div class="cu-widget">

			<div id="status-dot" class="status-dot"></div>

			<div class="usage-row">
				<div class="label-zone">
					<svg class="label-icon" viewBox="0 0 34 34" fill="none" xmlns="http://www.w3.org/2000/svg">
						<circle cx="17" cy="17" r="13.5" stroke="#888888" stroke-width="2.4"/>
						<line x1="17" y1="17" x2="17" y2="7" stroke="#888888" stroke-width="2.4" stroke-linecap="round"/>
						<line x1="17" y1="17" x2="23" y2="14" stroke="#888888" stroke-width="2.4" stroke-linecap="round"/>
					</svg>
					<div class="reset-time" id="reset-5h">—</div>
				</div>
				<div class="bar-zone">
					<div class="block-bar" id="bar-5h"></div>
				</div>
				<div class="pct-zone">
					<div class="pct-value" id="pct-5h">—%</div>
				</div>
			</div>

			<div class="row-divider"></div>

			<div class="usage-row">
				<div class="label-zone">
					<svg class="label-icon" viewBox="0 0 34 34" fill="none" xmlns="http://www.w3.org/2000/svg">
						<rect x="3" y="5" width="28" height="25" rx="3" stroke="#888888" stroke-width="2.4"/>
						<line x1="3" y1="13" x2="31" y2="13" stroke="#888888" stroke-width="2.4"/>
						<line x1="10" y1="3" x2="10" y2="8" stroke="#888888" stroke-width="2.4" stroke-linecap="round"/>
						<line x1="24" y1="3" x2="24" y2="8" stroke="#888888" stroke-width="2.4" stroke-linecap="round"/>
					</svg>
					<div class="reset-time" id="reset-7d">—</div>
				</div>
				<div class="bar-zone">
					<div class="block-bar" id="bar-7d"></div>
				</div>
				<div class="pct-zone">
					<div class="pct-value" id="pct-7d">—%</div>
				</div>
			</div>

			<div class="loading-overlay" id="loading-overlay">
				<div class="loading-title">Loading usage data...</div>
				<div class="loading-subtitle">contacting localhost:41920</div>
			</div>

			<div class="error-overlay" id="error-overlay">
				<div class="error-title" id="error-title">Unable to fetch usage</div>
				<div class="error-reason" id="error-reason"></div>
			</div>

		</div>

		<script src="scripts/claude-usage.js"></script>
		<script>
		icueEvents = {
			"onDataUpdated":     onIcueDataUpdated,
			"onICUEInitialized": onIcueInitialized
		};

		var pollTimer      = null;
		var resetTimer     = null;
		var activeInterval = 60;
		var lastResetsAt   = { fiveHour: null, sevenDay: null };

		function onIcueInitialized() {
			resolveConfig();
			ClaudeUsage.renderLoading();
			startPolling();
			startResetTimer();
		}

		function iCueAlreadyInitialized() {
			return typeof iCUE_initialized !== 'undefined' && iCUE_initialized;
		}

		function onIcueDataUpdated() {
			var prevInterval = activeInterval;
			resolveConfig();
			if (prevInterval !== activeInterval) {
				restartPolling();
			}
		}

		if (iCueAlreadyInitialized()) {
			onIcueInitialized();
		}

		function resolveConfig() {
			var n = parseInt(typeof refreshInterval !== 'undefined' ? refreshInterval : 60, 10);
			activeInterval = (Number.isFinite(n) && n > 0) ? n : 60;

			ClaudeUsage.configure({
				thresholdColorCoding: (typeof thresholdColorCoding !== 'undefined') ? (thresholdColorCoding === true || thresholdColorCoding === 'true' || thresholdColorCoding === 1) : true,
				textColor:            (typeof textColor            !== 'undefined') ? String(textColor)        : '#FFFFFF',
				blockColor:           (typeof blockColor           !== 'undefined') ? String(blockColor)       : '#3B82F6',
				emptyBlockColor:      (typeof emptyBlockColor      !== 'undefined') ? String(emptyBlockColor)  : '#484848',
				percentageColor:      (typeof percentageColor      !== 'undefined') ? String(percentageColor)  : '#FFFFFF',
				colorLow:             (typeof colorLow             !== 'undefined') ? String(colorLow)         : '#10B981',
				colorMid:             (typeof colorMid             !== 'undefined') ? String(colorMid)         : '#F59E0B',
				colorHigh:            (typeof colorHigh            !== 'undefined') ? String(colorHigh)        : '#EF4444',
				backgroundColor:      (typeof backgroundColor      !== 'undefined') ? String(backgroundColor)  : '#161616',
				transparency:         (typeof transparency         !== 'undefined') ? Number(transparency)     : 0
			});
		}

		function startPolling() {
			fetchUsage();
			pollTimer = setInterval(fetchUsage, activeInterval * 1000);
		}

		function restartPolling() {
			clearInterval(pollTimer);
			startPolling();
		}

		function fetchUsage() {
			resolveConfig();
			var isStaleResponse = false;

			fetch('http://localhost:41920/usage')
			.then(function (r) {
				isStaleResponse = r.headers.get('X-Cache-Stale') === 'true';
				if (!r.ok) {
					var status = r.status;
					return r.json().catch(function () { return {}; }).then(function (body) {
						var err = new Error(body.error || 'upstream_error');
						err.code   = body.error || 'upstream_error';
						err.status = status;
						throw err;
					});
				}
				return r.json();
			})
			.then(function (data) {
				lastResetsAt.fiveHour = data.five_hour.resets_at;
				lastResetsAt.sevenDay = data.seven_day.resets_at;
				ClaudeUsage.renderStale(isStaleResponse);
				ClaudeUsage.renderData(data);
			})
			.catch(renderFailure);
		}

		/**
		 * Shows why usage could not be displayed. A fetch rejection means the request never
		 * reached the service (connection refused: the service is not running) and carries no
		 * code; an error answer from the service carries its /status state code.
		 */
		function renderFailure(err) {
			ClaudeUsage.renderStale(false);
			if (err && err.code) {
				ClaudeUsage.renderError(err.code, err.status);
			} else {
				ClaudeUsage.renderError('service_offline');
			}
		}

		/** Refreshes the reset countdowns every 30 s without re-fetching; fetches again once a window has reset. */
		function startResetTimer() {
			if (resetTimer) clearInterval(resetTimer);
			resetTimer = setInterval(function () {
				var now = Date.now();
				var el5 = document.getElementById('reset-5h');
				var el7 = document.getElementById('reset-7d');
				var pastReset = false;
				if (el5 && lastResetsAt.fiveHour) {
					el5.textContent = ClaudeUsage.formatTimeUntil(lastResetsAt.fiveHour);
					if (new Date(lastResetsAt.fiveHour).getTime() < now) pastReset = true;
				}
				if (el7 && lastResetsAt.sevenDay) {
					el7.textContent = ClaudeUsage.formatTimeUntil(lastResetsAt.sevenDay);
					if (new Date(lastResetsAt.sevenDay).getTime() < now) pastReset = true;
				}
				if (pastReset) fetchUsage();
			}, 30000);
		}

		window.addEventListener('DOMContentLoaded', function () {
			if (typeof iCUE_initialized === 'undefined') renderPreviewStates();
		});

		/**
		 * Builds a head tag without writing it literally: iCUE finds the document head by plain text
		 * search and rejects the widget if the tag appears again later in the file.
		 * @param {string} slash '' for the opening tag, '/' for the closing one.
		 */
		function headTag(slash) {
			return '<' + slash + 'head>';
		}

		/** Preview mode (no iCUE runtime detected): renders all four design states stacked for browser review. */
		function renderPreviewStates() {
			var WIDGET_HTML = (
				'<!DOCTYPE html><html lang="en">' + headTag('') + '<meta charset="UTF-8">' +
				'<link rel="stylesheet" href="styles/ClaudeUsage.css">' + headTag('/') + '<body>' +
				'<div class="widget-background"></div>' +
				'<div class="cu-widget">' +
				'<div id="status-dot" class="status-dot"></div>' +
				'<div class="usage-row">' +
				'<div class="label-zone">' +
				'<svg class="label-icon" viewBox="0 0 34 34" fill="none" xmlns="http://www.w3.org/2000/svg">' +
				'<circle cx="17" cy="17" r="13.5" stroke="#888888" stroke-width="2.4"/>' +
				'<line x1="17" y1="17" x2="17" y2="7" stroke="#888888" stroke-width="2.4" stroke-linecap="round"/>' +
				'<line x1="17" y1="17" x2="23" y2="14" stroke="#888888" stroke-width="2.4" stroke-linecap="round"/>' +
				'</svg>' +
				'<div class="reset-time" id="reset-5h">—</div>' +
				'</div>' +
				'<div class="bar-zone"><div class="block-bar" id="bar-5h"></div></div>' +
				'<div class="pct-zone"><div class="pct-value" id="pct-5h">—%</div></div>' +
				'</div>' +
				'<div class="row-divider"></div>' +
				'<div class="usage-row">' +
				'<div class="label-zone">' +
				'<svg class="label-icon" viewBox="0 0 34 34" fill="none" xmlns="http://www.w3.org/2000/svg">' +
				'<rect x="3" y="5" width="28" height="25" rx="3" stroke="#888888" stroke-width="2.4"/>' +
				'<line x1="3" y1="13" x2="31" y2="13" stroke="#888888" stroke-width="2.4"/>' +
				'<line x1="10" y1="3" x2="10" y2="8" stroke="#888888" stroke-width="2.4" stroke-linecap="round"/>' +
				'<line x1="24" y1="3" x2="24" y2="8" stroke="#888888" stroke-width="2.4" stroke-linecap="round"/>' +
				'</svg>' +
				'<div class="reset-time" id="reset-7d">—</div>' +
				'</div>' +
				'<div class="bar-zone"><div class="block-bar" id="bar-7d"></div></div>' +
				'<div class="pct-zone"><div class="pct-value" id="pct-7d">—%</div></div>' +
				'</div>' +
				'<div class="loading-overlay" id="loading-overlay">' +
				'<div class="loading-title">Loading usage data...</div>' +
				'<div class="loading-subtitle">contacting localhost:41920</div>' +
				'</div>' +
				'<div class="error-overlay" id="error-overlay">' +
				'<div class="error-title">Unable to fetch usage</div>' +
				'<div class="error-reason" id="error-reason"></div>' +
				'</div>' +
				'</div>' +
				'<script src="scripts\/claude-usage.js"><\/script>' +
				'<script>' +
				'window.addEventListener("message",function(e){' +
				'var m=e.data||{};' +
				'if(m.type==="render"){if(m.config)ClaudeUsage.configure(m.config);ClaudeUsage.renderStale(!!m.stale);ClaudeUsage.renderData(m.data);}' +
				'if(m.type==="error")ClaudeUsage.renderError(m.message,m.detail);' +
				'if(m.type==="loading")ClaudeUsage.renderLoading();' +
				'});' +
				'<\/script>' +
				'</body></html>'
			);

			var now = Date.now();
			var STATES = [
				{
					label: 'Normal',
					msg: {
						type: 'render', stale: false,
						data: {
							five_hour: { utilization: 89.0, resets_at: new Date(now + 72 * 60000).toISOString() },
							seven_day: { utilization: 18.0, resets_at: new Date(now + (4 * 24 * 60 + 7 * 60) * 60000).toISOString() }
						}
					}
				},
				{
					label: 'Critical',
					msg: {
						type: 'render', stale: true,
						data: {
							five_hour: { utilization: 97.0, resets_at: new Date(now + 42000).toISOString() },
							seven_day: { utilization: 74.0, resets_at: new Date(now + (2 * 24 * 60 + 11 * 60) * 60000).toISOString() }
						}
					}
				},
				{
					label: 'Service offline (fetch failed)',
					msg: { type: 'error', message: 'service_offline' }
				},
				{
					label: 'Re-auth required',
					msg: { type: 'error', message: 'reauth_required' }
				},
				{
					label: 'Credentials missing',
					msg: { type: 'error', message: 'credentials_missing' }
				},
				{
					label: 'Token refresh failing',
					msg: { type: 'error', message: 'refresh_failed' }
				},
				{
					label: 'Anthropic API error (HTTP 500)',
					msg: { type: 'error', message: 'upstream_error', detail: 500 }
				},
				{
					label: 'Loading',
					msg: { type: 'loading' }
				},
				{
					label: 'Custom Style (purple theme, threshold coding OFF)',
					msg: {
						type: 'render', stale: false,
						config: {
							thresholdColorCoding: false,
							textColor:          '#E0E0E0',
							blockColor:         '#8B5CF6',
							percentageColor:    '#C4B5FD',
							colorLow:           '#A78BFA',
							colorMid:           '#C4B5FD',
							colorHigh:          '#DDD6FE',
							backgroundColor:    '#1E1E2E',
							transparency:       0
						},
						data: {
							five_hour: { utilization: 65.0, resets_at: new Date(now + 25 * 60000).toISOString() },
							seven_day: { utilization: 42.0, resets_at: new Date(now + (3 * 24 * 60 + 45 * 60) * 60000).toISOString() }
						}
					}
				}
			];

			document.body.innerHTML = '';
			document.body.style.cssText = 'margin:0;background:#111;padding:24px 0 48px;font-family:sans-serif;';

			var pairs = [];

			STATES.forEach(function (state) {
				var wrap = document.createElement('div');
				wrap.style.marginBottom = '32px';

				var lbl = document.createElement('div');
				lbl.style.cssText = 'font-size:12px;color:#666;text-align:center;padding:0 0 8px;letter-spacing:.06em;text-transform:uppercase;';
				lbl.textContent = state.label;

				var scaler = document.createElement('div');
				scaler.style.cssText = 'width:100%;max-width:840px;margin:0 auto;aspect-ratio:840/344;position:relative;overflow:hidden;';

				var frame = document.createElement('iframe');
				frame.title = state.label;
				frame.style.cssText = 'position:absolute;top:0;left:0;width:840px;height:344px;border:0;transform-origin:top left;';
				frame.srcdoc = WIDGET_HTML;

				var msg = state.msg;
				frame.addEventListener('load', function () {
					frame.contentWindow.postMessage(msg, '*');
					frame.style.transform = 'scale(' + (scaler.offsetWidth / 840) + ')';
				});

				pairs.push({ frame: frame, scaler: scaler });
				scaler.appendChild(frame);
				wrap.appendChild(lbl);
				wrap.appendChild(scaler);
				document.body.appendChild(wrap);
			});

			window.addEventListener('resize', function () {
				pairs.forEach(function (p) {
					p.frame.style.transform = 'scale(' + (p.scaler.offsetWidth / 840) + ')';
				});
			});
		}
		</script>
	</body>
</html>
