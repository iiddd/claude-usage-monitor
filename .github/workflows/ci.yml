name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, test, and validate
    # The service targets net10.0-windows, so it builds and tests on Windows.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Run tests
        run: dotnet test tests/ClaudeUsageServer.Tests -c Release --logger trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: TestResults

      - name: Publish service
        run: dotnet publish ClaudeUsageServer.csproj -c Release -r win-x64 --self-contained false -o publish

      # Package.wxs lists installed files by hand; catch dependency changes that would
      # otherwise ship an MSI missing a DLL.
      - name: Check installer covers every published file
        shell: pwsh
        run: ./.github/scripts/Test-InstallerFiles.ps1

      - name: Check for vulnerable NuGet packages
        shell: pwsh
        run: |
          $report = dotnet list ClaudeUsageServer.csproj package --vulnerable --include-transitive --format json | ConvertFrom-Json
          $vulnerable = @($report.projects | ForEach-Object { $_.frameworks } | Where-Object { $_ } |
            ForEach-Object { @($_.topLevelPackages) + @($_.transitivePackages) } | Where-Object { $_ })
          if ($vulnerable.Count -gt 0) {
            $vulnerable | ForEach-Object { Write-Output "::error::$($_.id) $($_.resolvedVersion) has a known vulnerability" }
            exit 1
          }
          Write-Output "No vulnerable packages found."

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Validate iCUE widget
        run: npx --yes icuewidget-cli@0.5.2 validate widgets/ClaudeUsageWidget
